<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)">
<title>rpi2 speaker</title>
<style>
  :root {
    --bg: #f3f4f7; --card: #fff; --fg: #17181c; --muted: #747882; --line: #e6e7eb;
    --accent: #3b5bfd; --accent-soft: #eaeefe; --on-accent: #fff; --btn: #f0f1f4; --danger: #e5484d;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1013; --card: #1a1b20; --fg: #ececf0; --muted: #9a9daa; --line: #2a2c33;
      --accent: #7189ff; --accent-soft: #23284a; --on-accent: #0f1013; --btn: #24262d; --danger: #ff6369;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding: 16px max(16px, env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; margin: 0 4px 14px; }
  header h1 { font-size: 20px; font-weight: 750; letter-spacing: -.02em; margin: 0; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: #30a46c; box-shadow: 0 0 0 4px rgb(48 164 108 / .18); }
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  h2 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -.01em; }
  h2 small { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
  button, input { font: inherit; color: inherit; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px;
           border: 0; border-radius: 12px; background: var(--btn); cursor: pointer; touch-action: manipulation; font-weight: 600;
           transition: transform .08s, opacity .15s; }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .3; pointer-events: none; }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.ghost { background: transparent; color: var(--muted); }
  button.icon { min-height: 40px; width: 40px; padding: 0; flex: none; border-radius: 50%; }
  button.text { min-height: 36px; padding: 0 12px; font-size: 14px; }
  svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  input[type=url], input[type=text] { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--bg); outline: none; }
  input[type=url]:focus, input[type=text]:focus { border-color: var(--accent); }
  input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; min-width: 0; }

  /* now playing */
  #np .state { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
  #np .title { font-size: 19px; font-weight: 700; letter-spacing: -.015em; margin: 4px 0 12px; min-height: 2.9em;
               overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #np .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .ctl { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; }
  .ctl button { background: transparent; width: 52px; height: 52px; padding: 0; border-radius: 50%; }
  .ctl button svg { width: 30px; height: 30px; }
  .ctl .sm svg { width: 22px; height: 22px; }
  .ctl .sm { color: var(--muted); position: relative; }
  .ctl .sm.on { color: var(--accent); }
  .ctl .sm.on::after { content: ""; position: absolute; bottom: 6px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
                       border-radius: 50%; background: var(--accent); }
  .ctl #pp { width: 72px; height: 72px; background: var(--accent); color: var(--on-accent); }
  .ctl #pp svg { width: 36px; height: 36px; }
  .vol { display: flex; align-items: center; gap: 10px; }
  .timer { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tlabel { display: inline-flex; color: var(--muted); width: 40px; justify-content: center; flex: none; }
  .tlabel.on { color: var(--accent); }
  .chips { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chips button { min-height: 36px; padding: 0 4px; font-size: 14px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .chips button.on { background: var(--accent); color: var(--on-accent); }
  .vol output { width: 32px; text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* segmented profile picker */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--btn); border-radius: 14px; margin-bottom: 12px; }
  .seg button { min-height: 40px; background: transparent; border-radius: 10px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }

  /* lists */
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 2px; min-height: 52px; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  ul.list .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 6px 0; cursor: pointer; }
  ul.list .no { width: 22px; flex: none; text-align: center; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  ul.list .no svg { width: 18px; height: 18px; color: var(--accent); }
  ul.list .t { flex: 1; min-width: 0; overflow: hidden; overflow-wrap: anywhere; font-size: 15px; line-height: 1.35;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  ul.list .sub { display: block; color: var(--muted); font-size: 13px; }
  ul.list li.cur .t { color: var(--accent); font-weight: 700; }
  ul.list li button.icon { color: var(--muted); background: transparent; width: 36px; }
  ul.list li button.icon svg { width: 20px; height: 20px; }
  .more { width: 100%; margin-top: 6px; color: var(--accent); background: var(--accent-soft); }
  ul.list li button.icon.play { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 15px; }
  details summary { list-style: none; cursor: pointer; display: flex; align-items: center; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "›"; color: var(--muted); font-size: 22px; transform: rotate(90deg); transition: transform .2s; }
  details[open] summary::after { transform: rotate(-90deg); }
  details[open] summary { margin-bottom: 12px; }
  /* morning call */
  select, input[type=time] { font: inherit; color: inherit; min-height: 48px; padding: 0 12px; border: 1px solid var(--line);
           border-radius: 12px; background: var(--bg); outline: none; min-width: 0; }
  input[type=time] { flex: none; font-variant-numeric: tabular-nums; }
  ul.list .clock { flex: none; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  ul.list li.off .clock, ul.list li.off .t { color: var(--muted); }
  button.switch { min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 999px; flex: none; }
  button.switch.on { background: var(--accent); color: var(--on-accent); }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; overflow-wrap: anywhere; }
  .gap { margin-top: 10px; }

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
           background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
           max-width: calc(100% - 32px); pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<main>
<header><span class="dot" id="dot"></span><h1>rpi2 speaker</h1></header>

<section class="card" id="np">
  <div class="state" id="state">정지됨</div>
  <div class="title" id="title">재생 중인 곡이 없어요</div>
  <input type="range" id="pos" min="0" max="0" step="1" aria-label="재생 위치" onchange="post('/api/seek',{time:+this.value})">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="sm" onclick="post('/api/stop')" aria-label="정지" data-i="stop"></button>
    <button onclick="post('/api/prev')" aria-label="이전 곡" data-i="prev"></button>
    <button id="pp" onclick="post('/api/pause')" aria-label="재생/일시정지" data-i="play"></button>
    <button onclick="post('/api/next')" aria-label="다음 곡" data-i="next"></button>
    <button class="sm" id="rep" onclick="cycleRepeat()" aria-label="반복" data-i="repeat"></button>
  </div>
  <div class="vol">
    <button class="icon ghost" id="mute" onclick="post('/api/mute')" aria-label="음소거" data-i="vol"></button>
    <input type="range" id="vol" min="0" max="100" aria-label="볼륨"
           oninput="volOut.value=this.value" onchange="post('/api/volume',{volume:+this.value})">
    <output id="volOut">0</output>
  </div>
  <div class="timer" role="group" aria-label="취침 타이머">
    <span class="tlabel" data-i="moon" id="tlabel"></span>
    <div class="chips" id="chips"></div>
  </div>
</section>

<section class="card">
  <div class="head"><h2>노래 추가</h2></div>
  <form onsubmit="addUrl(false);return false">
    <input type="url" id="url" placeholder="YouTube 링크 붙여넣기" required autocomplete="off">
    <div class="row gap">
      <button class="primary grow" data-i="play">지금 재생</button>
      <button type="button" class="grow" onclick="addUrl(true)" data-i="add">대기열에 추가</button>
    </div>
  </form>
  <div class="note">재생목록·믹스 링크는 앞 50곡까지 큐에 들어가요.</div>
</section>

<section class="card">
  <div class="head"><h2>재생 대기열<small id="qcount"></small></h2>
    <button class="ghost text" id="qclear" onclick="clearQueue()">모두 지우기</button></div>
  <ul class="list" id="queue"></ul>
  <button type="button" class="more text" id="qmore" hidden onclick="qOpen=!qOpen;$('queue').dataset.key='';renderQueue(lastQueue)"></button>
</section>

<section class="card">
  <div class="head"><h2>플레이리스트</h2></div>
  <div class="seg" id="prof" role="tablist" aria-label="프로필"></div>
  <form class="row" onsubmit="savePl();return false">
    <input type="text" id="plname" class="grow" placeholder="이름을 정해 지금 대기열 저장" maxlength="50" required autocomplete="off">
    <button class="primary" data-i="save">저장</button>
  </form>
  <ul class="list gap" id="pls"></ul>
</section>

<section class="card">
  <div class="head"><h2>모닝콜</h2></div>
  <form onsubmit="addAlarm();return false">
    <div class="row">
      <input type="time" id="atime" value="07:00" required aria-label="시각">
      <select id="apl" class="grow" required aria-label="플레이리스트"></select>
    </div>
    <div class="vol gap">
      <span class="tlabel" data-i="volLow"></span>
      <input type="range" id="avol" min="0" max="100" value="40" aria-label="모닝콜 볼륨" oninput="avolOut.value=this.value">
      <output id="avolOut">40</output>
    </div>
    <button class="primary gap" style="width:100%" data-i="add">모닝콜 추가</button>
  </form>
  <ul class="list gap" id="alarms"></ul>
  <div class="note">매일 그 시각에 대기열을 플레이리스트로 바꿔 재생해요.</div>
</section>

<section class="card" id="filesCard" hidden>
  <div class="head"><h2>내 음악 파일</h2></div>
  <ul class="list" id="files"></ul>
</section>

<details class="card">
  <summary><h2>시스템</h2></summary>
  <div class="row">
    <button class="grow" id="upd" onclick="update()">yt-dlp 업데이트</button>
    <button class="grow" onclick="confirm('스피커를 재부팅할까요?')&&post('/api/reboot')">재부팅</button>
  </div>
  <div class="note" id="sys">YouTube 재생이 안 될 때 yt-dlp를 업데이트해 보세요.</div>
</details>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = id => document.getElementById(id);
const ICONS = {
  play: 'M8 5.14v13.72c0 .79.87 1.27 1.54.84l10.8-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z',
  pause: 'M7 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm7 0h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z',
  prev: 'M6 5a1 1 0 0 1 1 1v4.6l10.47-6.3A1 1 0 0 1 19 5.15v13.7a1 1 0 0 1-1.53.85L7 13.4V18a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1z',
  next: 'M18 5a1 1 0 0 0-1 1v4.6L6.53 4.3A1 1 0 0 0 5 5.15v13.7a1 1 0 0 0 1.53.85L17 13.4V18a1 1 0 1 0 2 0V6a1 1 0 0 0-1-1z',
  stop: 'M7 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z',
  vol: 'M11 5.07v13.86a.75.75 0 0 1-1.24.57L5.7 16H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h2.7l4.06-3.5a.75.75 0 0 1 1.24.57zM15.5 8.2a1 1 0 0 1 1.41 0 5.5 5.5 0 0 1 0 7.6 1 1 0 1 1-1.43-1.4 3.5 3.5 0 0 0 0-4.8 1 1 0 0 1 .02-1.4zm2.8-2.8a1 1 0 0 1 1.42 0 9.5 9.5 0 0 1 0 13.2 1 1 0 0 1-1.43-1.4 7.5 7.5 0 0 0 0-10.4 1 1 0 0 1 .01-1.4z',
  mute: 'M11 5.07v13.86a.75.75 0 0 1-1.24.57L5.7 16H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h2.7l4.06-3.5a.75.75 0 0 1 1.24.57zM15.3 9.3a1 1 0 0 1 1.4 0l1.3 1.29 1.3-1.3a1 1 0 1 1 1.4 1.42L19.42 12l1.3 1.3a1 1 0 0 1-1.42 1.4L18 13.42l-1.3 1.3a1 1 0 0 1-1.4-1.42L16.58 12l-1.3-1.3a1 1 0 0 1 0-1.4z',
  volLow: 'M13 5.07v13.86a.75.75 0 0 1-1.24.57L7.7 16H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h2.7l4.06-3.5a.75.75 0 0 1 1.24.57zM17.5 8.2a1 1 0 0 1 1.41 0 5.5 5.5 0 0 1 0 7.6 1 1 0 1 1-1.43-1.4 3.5 3.5 0 0 0 0-4.8 1 1 0 0 1 .02-1.4z',
  add: 'M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z',
  up: 'M12 7.5a1 1 0 0 1 .7.3l6 6a1 1 0 0 1-1.4 1.4L12 9.92l-5.3 5.3a1 1 0 0 1-1.4-1.42l6-6a1 1 0 0 1 .7-.29z',
  down: 'M12 16.5a1 1 0 0 1-.7-.3l-6-6a1 1 0 0 1 1.4-1.4L12 14.08l5.3-5.3a1 1 0 1 1 1.4 1.42l-6 6a1 1 0 0 1-.7.29z',
  x: 'M6.3 6.3a1 1 0 0 1 1.4 0L12 10.58l4.3-4.3a1 1 0 1 1 1.4 1.42L13.42 12l4.3 4.3a1 1 0 0 1-1.42 1.4L12 13.42l-4.3 4.3a1 1 0 0 1-1.4-1.42L10.58 12 6.3 7.7a1 1 0 0 1 0-1.4z',
  trash: 'M9 3h6a1 1 0 0 1 1 1v1h4a1 1 0 1 1 0 2h-1l-.87 12.2A2 2 0 0 1 16.14 21H7.86a2 2 0 0 1-2-1.8L5 7H4a1 1 0 0 1 0-2h4V4a1 1 0 0 1 1-1zm-1.99 4 .85 12h8.28l.85-12H7.01zM10 9a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1zm4 0a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1z',
  save: 'M6 3h9.59a1 1 0 0 1 .7.3l3.42 3.4a1 1 0 0 1 .29.71V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h12V7.83L15.17 5H15v3a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V5H6zm4 0v2h3V5h-3zm2 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6z',
  repeat: 'M17.3 2.3a1 1 0 0 1 1.4 0l3 3a1 1 0 0 1 0 1.4l-3 3a1 1 0 1 1-1.4-1.4L18.58 7H7a3 3 0 0 0-3 3v1a1 1 0 1 1-2 0v-1a5 5 0 0 1 5-5h11.59L17.3 3.7a1 1 0 0 1 0-1.4zM21 12a1 1 0 0 1 1 1v1a5 5 0 0 1-5 5H5.41l1.3 1.3a1 1 0 1 1-1.42 1.4l-3-3a1 1 0 0 1 0-1.4l3-3a1 1 0 0 1 1.42 1.4L5.4 17H17a3 3 0 0 0 3-3v-1a1 1 0 0 1 1-1z',
  moon: 'M12.3 2.05a1 1 0 0 1 .27 1.12A7 7 0 0 0 20.83 11.4a1 1 0 0 1 1.38 1.06A10 10 0 1 1 11.2 1.8a1 1 0 0 1 1.1.25zM9.9 4.25a8 8 0 1 0 9.85 9.85A9 9 0 0 1 9.9 4.25z',
  repeatOne: 'M17.3 2.3a1 1 0 0 1 1.4 0l3 3a1 1 0 0 1 0 1.4l-3 3a1 1 0 1 1-1.4-1.4L18.58 7H7a3 3 0 0 0-3 3v1a1 1 0 1 1-2 0v-1a5 5 0 0 1 5-5h11.59L17.3 3.7a1 1 0 0 1 0-1.4zM21 12a1 1 0 0 1 1 1v1a5 5 0 0 1-5 5H5.41l1.3 1.3a1 1 0 1 1-1.42 1.4l-3-3a1 1 0 0 1 0-1.4l3-3a1 1 0 0 1 1.42 1.4L5.4 17H17a3 3 0 0 0 3-3v-1a1 1 0 0 1 1-1zM12.2 9.1a.75.75 0 0 1 .8.75v5.4a.75.75 0 0 1-1.5 0v-4.1l-.67.33a.75.75 0 1 1-.67-1.34l1.6-.8a.75.75 0 0 1 .44-.24z',
  bars: 'M5 10h2v9H5zm4-5h2v14H9zm4 7h2v7h-2zm4-4h2v11h-2z',
};
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', ICONS[name]);
  s.appendChild(p); return s;
}
function setIcon(e, name) { if (e.dataset.cur !== name) { e.dataset.cur = name; e.querySelector('svg')?.remove(); e.prepend(icon(name)); } }
document.querySelectorAll('[data-i]').forEach(e => setIcon(e, e.dataset.i));

function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function ibtn(name, label, f, cls) {
  const b = el('button', null, 'icon' + (cls ? ' ' + cls : '')); b.type = 'button';
  b.setAttribute('aria-label', label); b.title = label; b.appendChild(icon(name));
  b.onclick = e => { e.stopPropagation(); f(); }; return b;
}
// list row: left marker, title (+ optional subtitle), trailing icon buttons; tapping the body runs onTap
function row(marker, title, sub, onTap, ...buttons) {
  const li = el('li'), main = el('div', null, 'main'), t = el('span', title, 't');
  if (sub) t.appendChild(el('span', sub, 'sub'));
  main.append(marker, t); if (onTap) main.onclick = onTap;
  li.append(main, ...buttons); return li;
}

let toastTimer;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = err ? 'err' : '', 2200);
}
async function api(p, body) {
  try {
    const r = await (await fetch(p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})})).json();
    if (r.error) { toast('오류: ' + r.error, true); return null; }
    return r;
  } catch (e) { toast('스피커에 연결할 수 없어요', true); return null; }
}
async function post(p, body, msg) { const r = await api(p, body); if (r) { show(r); if (msg) toast(msg); } return r; }

function fmt(s) {
  s = Math.floor(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : m + ':' + x;
}
function show(s) {
  if (!('idle' in s)) return;
  const loading = !s.idle && !s.duration;
  $('dot').className = 'dot' + (!s.idle && !s.paused ? ' live' : '');
  $('state').textContent = s.idle ? '정지됨' : loading ? '불러오는 중…' : s.paused ? '일시정지' : '재생 중';
  $('title').textContent = s.idle ? '재생 중인 곡이 없어요' : loading && /^https?:|^watch\?/.test(s.title) ? '잠시만 기다려 주세요' : s.title;
  setIcon($('pp'), !s.idle && !s.paused ? 'pause' : 'play');
  const pos = $('pos'), vol = $('vol');
  pos.max = Math.floor(s.duration || 0); pos.disabled = !pos.max;
  if (document.activeElement !== pos) pos.value = Math.floor(s.time || 0);
  $('cur').textContent = fmt(s.time); $('dur').textContent = fmt(s.duration);
  if (document.activeElement !== vol) { vol.value = s.volume; $('volOut').value = Math.round(s.volume); }
  setIcon($('mute'), s.mute ? 'mute' : 'vol');
  repeat = s.repeat;
  const rep = $('rep'), [ri, rl] = REPEAT_UI[repeat];
  setIcon(rep, ri); rep.className = 'sm' + (repeat === 'off' ? '' : ' on');
  rep.setAttribute('aria-label', rl); rep.title = rl;
  showTimer(s.timer);
  renderQueue(s.queue);
}
// long queues (mixes are 50 tracks) collapse to a window around the current track
const QWIN = 6;
let qOpen = false, lastQueue = [];
function renderQueue(q) {
  lastQueue = q;
  const ul = $('queue'), key = JSON.stringify(q);
  if (key === ul.dataset.key) return;
  ul.dataset.key = key; ul.innerHTML = '';
  $('qcount').textContent = q.length ? q.length + '곡' : '';
  $('qclear').hidden = !q.length;
  if (!q.length) ul.appendChild(el('li', '대기열이 비어 있어요. 위에서 노래를 추가해 보세요.', 'empty'));
  const cur = Math.max(0, q.findIndex(x => x.current));
  const from = qOpen ? 0 : Math.max(0, Math.min(cur - 1, q.length - QWIN)), to = qOpen ? q.length : from + QWIN;
  $('qmore').hidden = q.length <= QWIN;
  $('qmore').textContent = qOpen ? '접기' : `전체 ${q.length}곡 보기`;
  q.forEach((item, i) => {
    if (i < from || i >= to) return;
    const marker = el('span', item.current ? null : String(i + 1), 'no');
    if (item.current) marker.appendChild(icon('bars'));
    const up = ibtn('up', '위로', () => post('/api/move', {from: i, to: i - 1}));
    const down = ibtn('down', '아래로', () => post('/api/move', {from: i, to: i + 1}));
    up.disabled = i === 0; down.disabled = i === q.length - 1;
    const li = row(marker, item.title, null, () => post('/api/jump', {index: i}), up, down,
                   ibtn('x', '대기열에서 빼기', () => post('/api/remove', {index: i})));
    if (item.current) li.className = 'cur';
    ul.appendChild(li);
  });
}
const REPEAT_UI = {off: ['repeat', '반복 꺼짐'], all: ['repeat', '전체 반복'], one: ['repeatOne', '1곡 반복']};
const REPEAT_NEXT = {off: 'all', all: 'one', one: 'off'};
let repeat = 'off';
function cycleRepeat() { const m = REPEAT_NEXT[repeat]; post('/api/repeat', {mode: m}, REPEAT_UI[m][1]); }
// sleep timer: tap a duration to arm it, tap the running one (shows time left) to cancel
const TIMERS = [[15, '15분'], [30, '30분'], [60, '1시간'], [180, '3시간']];
let timerMin = 0, timerEnd = 0;
TIMERS.forEach(([m, label]) => {
  const b = el('button', label); b.type = 'button'; b.dataset.m = m;
  b.onclick = () => timerMin === m ? post('/api/timer', {minutes: 0}, '타이머를 껐어요')
                                   : post('/api/timer', {minutes: m}, label + ' 뒤에 멈춰요').then(r => r && (timerMin = m, tickTimer()));
  $('chips').appendChild(b);
});
function showTimer(left) {
  if (left == null) timerMin = 0;
  else { timerEnd = Date.now() + left * 1000; if (!timerMin) timerMin = TIMERS.find(([m]) => m * 60 >= left)[0]; }
  tickTimer();
}
function tickTimer() {
  const left = timerMin ? Math.max(0, Math.round((timerEnd - Date.now()) / 1000)) : 0;
  for (const b of $('chips').children) {
    const on = +b.dataset.m === timerMin;
    b.className = on ? 'on' : '';
    b.textContent = on ? fmt(left) : TIMERS.find(([m]) => m === +b.dataset.m)[1];
    b.setAttribute('aria-label', on ? '타이머 끄기, ' + fmt(left) + ' 남음' : b.textContent + ' 뒤 멈춤');
  }
  $('tlabel').className = 'tlabel' + (timerMin ? ' on' : '');
}
setInterval(tickTimer, 1000);
function addUrl(next) {
  const u = $('url'); if (!u.reportValidity()) return;
  post(next ? '/api/queue' : '/api/play', {url: u.value}, next ? '대기열에 추가했어요' : '곧 재생돼요')
    .then(r => { if (r) u.value = ''; });
}
function clearQueue() {
  if (confirm('대기열을 모두 지울까요? (지금 곡은 남아요)')) post('/api/clear', {}, '대기열을 비웠어요');
}
async function update() {
  const b = $('upd'), out = $('sys');
  b.disabled = true; out.textContent = '업데이트 중… (몇 분 걸려요)';
  const r = await api('/api/update');
  out.textContent = r ? (r.ok ? '완료: yt-dlp ' + r.version : '실패: ' + r.log) : '실패';
  b.disabled = false;
}

let profile = null, playlists = {};
try { profile = localStorage.getItem('profile'); } catch (e) {}
function setProfile(p) {
  profile = p;
  try { localStorage.setItem('profile', p); } catch (e) {}
  for (const b of $('prof').children) { const on = b.textContent === p; b.className = on ? 'on' : ''; b.setAttribute('aria-selected', on); }
  renderPls();
  // another phone may have changed playlists since load
  fetch('/api/playlists').then(r => r.json()).then(d => { playlists = d.playlists; renderPls(); });
}
function renderPls() {
  renderAlarmPicker();
  const ul = $('pls'); ul.innerHTML = '';
  const mine = playlists[profile] || {};
  const names = Object.keys(mine).sort((a, b) => a.localeCompare(b, 'ko'));
  if (!names.length) ul.appendChild(el('li', profile + '의 플레이리스트가 없어요. 대기열을 저장해 보세요.', 'empty'));
  for (const n of names) {
    const play = () => post('/api/playlist/play', {profile, name: n}, `'${n}' 재생`);
    ul.appendChild(row(el('span', null, 'no'), n, mine[n].length + '곡', play,
      ibtn('play', '재생 (대기열 바꾸기)', play, 'play'),
      ibtn('add', '대기열 끝에 추가', () => post('/api/playlist/play', {profile, name: n, append: true}, `'${n}' 대기열에 추가`)),
      ibtn('trash', '삭제', () => confirm(`'${n}' 플레이리스트를 삭제할까요?`) && plPost('/api/playlist/delete', {profile, name: n}, '삭제했어요'))));
  }
}
async function plPost(p, body, msg) {
  const r = await api(p, body);
  if (r) { playlists = r; renderPls(); toast(msg); }
  return r;
}

// morning call: daily alarms that replace the queue with a saved playlist
let alarms = [];
function renderAlarmPicker() {
  const sel = $('apl'), keep = sel.value; sel.innerHTML = '';
  for (const [p, pls] of Object.entries(playlists)) {
    const names = Object.keys(pls).sort((a, b) => a.localeCompare(b, 'ko'));
    if (!names.length) continue;
    const g = el('optgroup'); g.label = p;
    for (const n of names) { const o = el('option', n); o.value = JSON.stringify([p, n]); g.appendChild(o); }
    sel.appendChild(g);
  }
  if (!sel.children.length) { const o = el('option', '저장된 플레이리스트가 없어요'); o.value = ''; sel.appendChild(o); }
  sel.value = keep;
  if (sel.selectedIndex < 0) sel.value = sel.querySelector(`optgroup[label="${profile}"] option`)?.value ?? sel.options[0].value;
}
function renderAlarms() {
  const ul = $('alarms'); ul.innerHTML = '';
  if (!alarms.length) ul.appendChild(el('li', '모닝콜이 없어요.', 'empty'));
  for (const a of alarms) {
    const sw = el('button', a.on ? '켜짐' : '꺼짐', 'switch' + (a.on ? ' on' : '')); sw.type = 'button';
    sw.setAttribute('aria-pressed', a.on); sw.setAttribute('aria-label', `${a.time} 모닝콜 ${a.on ? '끄기' : '켜기'}`);
    sw.onclick = () => alarmPost('/api/alarm/save', {...a, on: !a.on}, a.on ? '모닝콜을 껐어요' : a.time + ' 모닝콜을 켰어요');
    const li = row(el('span', a.time, 'clock'), a.name, `${a.profile} · 볼륨 ${a.volume}`, null, sw,
      ibtn('trash', '삭제', () => confirm(`${a.time} 모닝콜을 삭제할까요?`) && alarmPost('/api/alarm/delete', {id: a.id}, '삭제했어요')));
    if (!a.on) li.className = 'off';
    ul.appendChild(li);
  }
}
async function alarmPost(p, body, msg) {
  const r = await api(p, body);
  if (r) { alarms = r; renderAlarms(); toast(msg); }
  return r;
}
function addAlarm() {
  if (!$('apl').value) return toast('먼저 플레이리스트를 저장해 주세요', true);
  const [p, n] = JSON.parse($('apl').value), t = $('atime').value;
  alarmPost('/api/alarm/save', {time: t, profile: p, name: n, volume: +$('avol').value}, `매일 ${t}에 '${n}' 재생`);
}
fetch('/api/alarms').then(r => r.json()).then(a => { alarms = a; renderAlarms(); });
async function savePl() {
  const inp = $('plname'), n = inp.value.trim();
  if (!n) return;
  if ((playlists[profile] || {})[n] && !confirm(`'${n}'을(를) 지금 대기열로 덮어쓸까요?`)) return;
  if (await plPost('/api/playlist/save', {profile, name: n}, `${profile}: '${n}' 저장했어요`)) inp.value = '';
}

fetch('/api/playlists').then(r => r.json()).then(d => {
  playlists = d.playlists;
  for (const p of d.profiles) {
    const b = el('button', p); b.type = 'button'; b.setAttribute('role', 'tab'); b.onclick = () => setProfile(p);
    $('prof').appendChild(b);
  }
  setProfile(d.profiles.includes(profile) ? profile : d.profiles[0]);
});
fetch('/api/files').then(r => r.json()).then(fs => {
  $('filesCard').hidden = !fs.length;
  for (const f of fs) {
    const play = () => post('/api/play', {url: f}, '곧 재생돼요');
    $('files').appendChild(row(el('span', null, 'no'), f.split('/').pop(), f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : null, play,
      ibtn('play', '지금 재생', play, 'play'), ibtn('add', '대기열에 추가', () => post('/api/queue', {url: f}, '대기열에 추가했어요'))));
  }
});
const poll = () => fetch('/api/status').then(r => r.json()).then(show, () => $('dot').className = 'dot');
poll(); setInterval(poll, 2000);
</script>
